<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1780" role="img" aria-labelledby="title desc">
  <title id="title">Путь запроса в системе обратимой селективной компрессии</title>
  <desc id="desc">Принятое событие добавляется в неизменяемый архив и индексируется. Из архива, чанков, вектора намерения и правил защиты собирается снимок истории. Система проверяет бюджет: если он не помещается, исключаются только разрешённые чанки уровня 1; при невозможности уложиться запрос завершается без вызова модели. После ответа модель может запросить ограниченное чтение архива; вызов чтения и результат сохраняются как новые события. Итоговый ответ также сохраняется в архив.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#245e4c"/></marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8a6a45"/></marker>
    <style>
      .node{fill:#fffef9;stroke:#245e4c;stroke-width:2.5}.decision{fill:#f5edda;stroke:#8a6a45;stroke-width:2.5}
      .edge{fill:none;stroke:#245e4c;stroke-width:3;marker-end:url(#arrow)}.optional{fill:none;stroke:#8a6a45;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow-muted)}
      text{font-family:Arial,sans-serif;fill:#19382f;text-anchor:middle;font-size:20px}.edge-label{font-size:16px;font-weight:bold;paint-order:stroke;stroke:#f6f4ed;stroke-width:6px;stroke-linejoin:round}
    </style>
  </defs>
  <g>
    <path class="edge" d="M450 92V130"/><path class="edge" d="M365 205L215 255"/><path class="edge" d="M535 205L685 255"/>
    <path class="edge" d="M215 347L350 535"/><path class="edge" d="M685 347L550 535"/><path class="edge" d="M215 482L350 535"/><path class="edge" d="M685 482L550 535"/>
    <path class="edge" d="M450 615V670"/><path class="edge" d="M570 730L640 850"/><path class="edge" d="M450 790L340 1160"/>
    <path class="edge" d="M685 950V1000"/><path class="edge" d="M685 1100L720 1160"/><path class="edge" d="M515 1050L420 1160"/>
    <path class="edge" d="M340 1240V1295"/><path class="edge" d="M290 1360L215 1440"/><path class="edge" d="M390 1360L685 1440"/>
    <path class="edge" d="M215 1520V1600"/><path class="optional" d="M45 300H18V1650H45"/>
    <path class="optional" d="M385 1650H8V585H300"/><path class="optional" d="M850 1480H885V300H855"/>
    <text class="edge-label" x="585" y="815">нет</text><text class="edge-label" x="465" y="805">да</text>
    <text class="edge-label" x="740" y="1140">нет</text><text class="edge-label" x="500" y="1080">да</text>
    <text class="edge-label" x="285" y="1415">да</text><text class="edge-label" x="615" y="1415">нет</text>
  </g>
  <g>
    <rect class="node" x="250" y="20" width="400" height="72" rx="16"/><text x="450" y="64">Принятое событие диалога</text>
    <rect class="node" x="250" y="130" width="400" height="75" rx="16"/><text x="450" y="176">Добавить запись в архив</text>
    <rect class="node" x="45" y="255" width="340" height="92" rx="16"/><text x="215" y="295"><tspan x="215">Неизменяемый</tspan><tspan x="215" dy="25">архив</tspan></text>
    <rect class="node" x="515" y="255" width="340" height="92" rx="16"/><text x="685" y="295"><tspan x="685">Чанки, стабильные адреса</tspan><tspan x="685" dy="25">и embeddings</tspan></text>
    <rect class="node" x="45" y="390" width="340" height="92" rx="16"/><text x="215" y="430"><tspan x="215">Вектор намерения:</tspan><tspan x="215" dy="25">новое сообщение или cap</tspan></text>
    <rect class="node" x="515" y="390" width="340" height="92" rx="16"/><text x="685" y="430"><tspan x="685">Защита уровней 5 и 4</tspan><tspan x="685" dy="25">и протокольных зависимостей</tspan></text>
    <rect class="node" x="250" y="535" width="400" height="80" rx="16"/><text x="450" y="582">Проекция полного снимка истории</text>
    <path class="decision" d="M450 670L600 730L450 790L300 730Z"/><text x="450" y="725"><tspan x="450">Вся отправка</tspan><tspan x="450" dy="25">помещается?</tspan></text>
    <rect class="node" x="515" y="850" width="340" height="100" rx="16"/><text x="685" y="885"><tspan x="685">Исключить только разрешённые</tspan><tspan x="685" dy="25">чанки уровня 1 по cosine;</tspan><tspan x="685" dy="25">добавить адреса пропусков</tspan></text>
    <path class="decision" d="M685 1000L815 1050L685 1100L555 1050Z"/><text x="685" y="1045"><tspan x="685">Бюджет достигнут?</tspan></text>
    <rect class="node" x="570" y="1160" width="300" height="90" rx="16"/><text x="720" y="1195"><tspan x="720">budget_unachievable</tspan><tspan x="720" dy="25">завершить без вызова LLM</tspan></text>
    <rect class="node" x="150" y="1160" width="380" height="80" rx="16"/><text x="340" y="1208">Запрос к LLM</text>
    <rect class="decision" x="190" y="1295" width="300" height="65" rx="16"/><text x="340" y="1337">Модель запросила read?</text>
    <rect class="node" x="45" y="1440" width="340" height="80" rx="16"/><text x="215" y="1475"><tspan x="215">Ограниченное чтение</tspan><tspan x="215" dy="25">по адресам архива</tspan></text>
    <rect class="node" x="515" y="1440" width="340" height="80" rx="16"/><text x="685" y="1475"><tspan x="685">Сохранить итоговый ответ</tspan><tspan x="685" dy="25">как новую запись</tspan></text>
    <rect class="node" x="45" y="1600" width="340" height="100" rx="16"/><text x="215" y="1635"><tspan x="215">Сохранить вызов и результат</tspan><tspan x="215" dy="25">как события; защитить</tspan><tspan x="215" dy="25">активную цепочку</tspan></text>
  </g>
</svg>
